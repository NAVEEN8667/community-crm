<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends of Finance — Community Activity CRM</title>
    <meta name="description" content="CRM dashboard for managing Friends of Finance community members, tracking activity, and identifying engagement opportunities.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">Friends of Finance</span>
                <span class="brand-sub">Community CRM</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">Dashboard</div>
            <a href="#" class="nav-item active" data-view="overview" id="nav-overview">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span>Overview</span>
            </a>

            <div class="nav-section-label">Members</div>
            <a href="#" class="nav-item" data-view="all-members" id="nav-all-members">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>All Members</span>
            </a>
            <a href="#" class="nav-item" data-view="new-members" id="nav-new-members">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                <span>Newly Joined</span>
            </a>
            <a href="#" class="nav-item" data-view="highly-active" id="nav-highly-active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>Highly Active</span>
            </a>
            <a href="#" class="nav-item" data-view="at-risk" id="nav-at-risk">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>At Risk / Dormant</span>
            </a>

            <div class="nav-section-label">Actions</div>
            <a href="#" class="nav-item" data-view="follow-up" id="nav-follow-up">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span>Follow-Up Queue</span>
            </a>
            <a href="#" class="nav-item" data-view="ai-assistant" id="nav-ai-assistant">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.57-3.25 3.92L12 22"/><path d="M12 2a4 4 0 0 0-4 4c0 1.95 1.4 3.57 3.25 3.92"/><line x1="4.5" y1="9" x2="19.5" y2="9"/><path d="M8 15h8"/><path d="M9 18h6"/></svg>
                <span>AI Assistant</span>
                <span class="nav-badge">Simulated</span>
            </a>

            <div class="nav-section-label">Info</div>
            <a href="#" class="nav-item" data-view="help" id="nav-help">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>Help &amp; Guide</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="cm-profile">
                <div class="cm-avatar">CM</div>
                <div class="cm-info">
                    <span class="cm-name">Community Manager</span>
                    <span class="cm-role">Admin</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Top Header Bar -->
        <header class="top-bar" id="top-bar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="search-wrapper" id="global-search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" id="global-search" placeholder="Search members by name, email, or interest…" autocomplete="off">
            </div>
            <div class="top-bar-actions">
                <button class="btn btn-primary" id="btn-add-member">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Member
                </button>
            </div>
        </header>

        <!-- View Containers -->
        <div class="view-container" id="view-overview"></div>
        <div class="view-container" id="view-all-members" style="display:none;"></div>
        <div class="view-container" id="view-new-members" style="display:none;"></div>
        <div class="view-container" id="view-highly-active" style="display:none;"></div>
        <div class="view-container" id="view-at-risk" style="display:none;"></div>
        <div class="view-container" id="view-follow-up" style="display:none;"></div>
        <div class="view-container" id="view-ai-assistant" style="display:none;"></div>
        <div class="view-container" id="view-member-detail" style="display:none;"></div>
        <div class="view-container" id="view-help" style="display:none;"></div>
    </main>

    <!-- Modal: Add/Edit Member -->
    <div class="modal-overlay" id="modal-member" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-member-title">Add New Member</h2>
                <button class="modal-close" id="modal-member-close" aria-label="Close">&times;</button>
            </div>
            <form id="form-member" class="modal-body">
                <input type="hidden" id="member-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="member-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="member-name" required placeholder="e.g. Jane Smith">
                    </div>
                    <div class="form-group">
                        <label for="member-email">Email <span class="required">*</span></label>
                        <input type="email" id="member-email" required placeholder="jane@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="member-phone">Phone</label>
                        <input type="tel" id="member-phone" placeholder="+1-555-0123">
                    </div>
                    <div class="form-group">
                        <label for="member-join-date">Join Date <span class="required">*</span></label>
                        <input type="date" id="member-join-date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="member-owner">Owner</label>
                        <select id="member-owner">
                            <option value="Alex Kim">Alex Kim</option>
                            <option value="Jordan Lee">Jordan Lee</option>
                            <option value="Priya Nair">Priya Nair</option>
                            <option value="Unassigned">Unassigned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="member-next-action">Next Action</label>
                        <input type="text" id="member-next-action" placeholder="e.g. Welcome call">
                    </div>
                </div>
                <div class="form-group">
                    <label for="member-interests">Interests (comma-separated)</label>
                    <input type="text" id="member-interests" placeholder="e.g. Personal Finance, Investing, Budgeting">
                </div>
                <div class="form-group">
                    <label for="member-notes">Notes</label>
                    <textarea id="member-notes" rows="3" placeholder="Additional notes about this member…"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="btn-cancel-member">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-member">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Record Activity -->
    <div class="modal-overlay" id="modal-activity" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>Record Activity</h2>
                <button class="modal-close" id="modal-activity-close" aria-label="Close">&times;</button>
            </div>
            <form id="form-activity" class="modal-body">
                <input type="hidden" id="activity-member-id">
                <div class="form-group">
                    <label for="activity-member-display">Member</label>
                    <input type="text" id="activity-member-display" readonly class="readonly-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="activity-type">Activity Type <span class="required">*</span></label>
                        <select id="activity-type" required>
                            <option value="">Select type…</option>
                            <option value="Forum Post">Forum Post</option>
                            <option value="Forum Comment">Forum Comment</option>
                            <option value="Webinar Attended">Webinar Attended</option>
                            <option value="Workshop Participation">Workshop Participation</option>
                            <option value="Study Group Session">Study Group Session</option>
                            <option value="Mentorship Meeting">Mentorship Meeting</option>
                            <option value="Event Attendance">Event Attendance</option>
                            <option value="Resource Shared">Resource Shared</option>
                            <option value="Question Asked">Question Asked</option>
                            <option value="Peer Introduction">Peer Introduction</option>
                            <option value="Challenge Completed">Challenge Completed</option>
                            <option value="Content Contribution">Content Contribution</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="activity-date">Date <span class="required">*</span></label>
                        <input type="date" id="activity-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="activity-space">Community Space <span class="required">*</span></label>
                    <select id="activity-space" required>
                        <option value="">Select space…</option>
                        <option value="Personal Finance Forum">Personal Finance Forum</option>
                        <option value="Investment Circle">Investment Circle</option>
                        <option value="Tax Planning Hub">Tax Planning Hub</option>
                        <option value="Budgeting Bootcamp">Budgeting Bootcamp</option>
                        <option value="Retirement Planning Group">Retirement Planning Group</option>
                        <option value="FinTech Innovation Lab">FinTech Innovation Lab</option>
                        <option value="Wealth Building Mentorship">Wealth Building Mentorship</option>
                        <option value="Community Events">Community Events</option>
                        <option value="Welcome & Onboarding">Welcome & Onboarding</option>
                        <option value="Financial Literacy Library">Financial Literacy Library</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="activity-details">Details</label>
                    <textarea id="activity-details" rows="3" placeholder="Describe the activity…"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="btn-cancel-activity">Cancel</button>
                    <button type="submit" class="btn btn-primary">Record Activity</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
